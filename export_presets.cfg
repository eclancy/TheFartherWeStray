[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, build/*, tools/*, .shots/*, .claude/*"
export_path="build/android/TheFartherWeStray.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; The version code must climb with every APK, or Android won't install it over the last one:
; major*10000 + minor*100 + patch, from application/config/version (0.2.0 is 200). The version
; name is left empty so Godot uses application/config/version.
version/code=400
version/name=""
; The app's identity on Android: never change it, or it's a second app that can't update the first.
package/unique_name="com.ecec.thefartherwestray"
package/name="The Farther We Stray"
package/signed=true
package/show_in_android_tv=false
package/show_in_app_library=true
launcher_icons/main_192x192="res://icon/android-main.png"
launcher_icons/adaptive_foreground_432x432="res://icon/android-foreground.png"
launcher_icons/adaptive_background_432x432="res://icon/android-background.png"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; The update check (UpdateBanner) fetches version.json: without this the APK has no permissions at
; all, and no phone ever hears of a new release (0.4.0 and before shipped so). It's the only one.
permissions/internet=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

